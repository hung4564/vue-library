# ./.github/workflows/publish.yml
name: Publish

on:
  push:
    tags:
      # Group releases from scripts/release-group.js
      - 'draggable@*'
      - 'map@*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for provenance data generation
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release group from tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            draggable@*)
              echo "group=draggable" >> "$GITHUB_OUTPUT"
              ;;
            map@*)
              echo "group=map" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: $TAG (expected draggable@<version> or map@<version>)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved group=$(echo "$TAG" | cut -d@ -f1) from $TAG"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Print Environment Info
        run: npx nx report
        shell: bash

      - name: Build release group
        run: npx nx run-many --projects=tag:${{ steps.meta.outputs.group }} --exclude=tag:demo --target=build
        shell: bash

      - name: Publish packages (${{ steps.meta.outputs.group }})
        run: npx nx release publish --group=${{ steps.meta.outputs.group }} --yes
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
