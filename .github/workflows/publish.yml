# ./.github/workflows/publish.yml
name: Publish

on:
  push:
    tags:
      # Group releases from scripts/release-group.js
      - 'draggable@*'
      - 'map@*'
      - 'shared-store@*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for provenance data generation
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release group from tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            draggable@*)
              echo "group=draggable" >> "$GITHUB_OUTPUT"
              ;;
            map@*)
              echo "group=map" >> "$GITHUB_OUTPUT"
              ;;
            shared-store@*)
              echo "group=shared-store" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: $TAG (expected draggable@ / map@ / shared-store@)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved group=$(echo "$TAG" | cut -d@ -f1) from $TAG"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install
        shell: bash

      - name: Print Environment Info
        run: npx nx report
        shell: bash

      - name: Build release group (no cache — dist must match tag version)
        shell: bash
        run: |
          GROUP="${{ steps.meta.outputs.group }}"
          # Resolve only projects that actually have `build` (avoids Nx noise for
          # demos/e2e that share tags but have no build target).
          PROJECTS="$(npx nx show projects --projects="tag:${GROUP}" --exclude=tag:demo,tag:e2e --with-target=build | paste -sd, -)"
          if [ -z "$PROJECTS" ]; then
            echo "::error::No buildable projects for tag:${GROUP}"
            exit 1
          fi
          echo "Building: $PROJECTS"
          npx nx run-many --projects="$PROJECTS" --target=build --skip-nx-cache

      - name: Verify dist versions match tag
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VER="${TAG#*@}"
          GROUP="${{ steps.meta.outputs.group }}"
          echo "Expecting $GROUP packages at version $VER"
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const tag = process.env.TAG;
          const ver = tag.split('@')[1];
          const group = process.env.GROUP;
          const projects = execSync(
            `npx nx show projects --projects=tag:${group} --exclude=tag:demo,tag:e2e --with-target=build`,
            { encoding: 'utf8' },
          )
            .trim()
            .split(/\s+/)
            .filter(Boolean);
          let fail = 0;
          for (const name of projects) {
            // project name == package name for these libs; resolve root via nx
            const root = execSync(`npx nx show project ${name} --json`, {
              encoding: 'utf8',
            });
            const { root: projectRoot } = JSON.parse(root);
            const distPkg = `dist/${projectRoot}/package.json`;
            if (!fs.existsSync(distPkg)) {
              console.error(`MISSING ${distPkg}`);
              fail = 1;
              continue;
            }
            const pkg = JSON.parse(fs.readFileSync(distPkg, 'utf8'));
            console.log(`${pkg.name}@${pkg.version} (${distPkg})`);
            if (pkg.version !== ver) {
              console.error(`ERROR: expected ${ver}, got ${pkg.version}`);
              fail = 1;
            }
          }
          process.exit(fail);
          NODE
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GROUP: ${{ steps.meta.outputs.group }}

      - name: Check npm publish token
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Missing secret NPM_ACCESS_TOKEN."
            echo "Create an npm Automation token (or Granular Access Token with Read+Write for @hungpvq/*),"
            echo "then add it as repo secret NPM_ACCESS_TOKEN."
            echo "Token user must be maintainer/owner of the @hungpvq packages on npmjs.com."
            exit 1
          fi
          echo "NPM_ACCESS_TOKEN is set (${#NODE_AUTH_TOKEN} chars)."

      - name: Publish packages (${{ steps.meta.outputs.group }})
        run: npx nx release publish --group=${{ steps.meta.outputs.group }} --yes
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          # Provenance needs a token that can publish + id-token: write (already set).
          # If publish still fails with 403, regenerate token type/scope on npm — not git push.
          NPM_CONFIG_PROVENANCE: true
          NX_SKIP_NX_CACHE: true
